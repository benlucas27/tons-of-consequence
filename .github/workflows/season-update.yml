# Season update (switched on 20 Oct 2026 with Ben's go-ahead).
# Keeps new hundreds coming through the Australian summer: every Tuesday from October to March (about 7am Sydney time)
# it adds new centuries from Cricsheet, settles finished matches, refreshes the verdicts, and publishes only if the
# tests and build pass. The monthly update still does the full audit. Can also be run by hand from GitHub > Actions.
# Outside the summer the monthly update (monthly-update.yml, the 2nd of each month) does the job. When Australia tours and plays
# Tests elsewhere (for example the 2027 Ashes in England), add that window to the cron below.
name: Season update

on:
  schedule:
    - cron: '23 20 * 10-12,1-3 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: season-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Add new centuries and settle finished matches
        run: node scripts/add-new-centuries.mjs --write | tee update.log

      # Verdicts are only rebuilt when new hundreds arrived, and never published if an existing yes/no changes.
      - name: Refresh the Consequence Test verdicts
        run: |
          if git diff --quiet -- src/data/sample.js; then echo "No new hundreds: verdicts left as they are."; exit 0; fi
          node scripts/build-consequence.mjs --download
          node scripts/check-verdict-flips.mjs

      - run: npm test
      - run: npm run build

      - name: Commit and publish
        id: publish
        run: |
          if git diff --quiet -- src/data docs/drafts; then
            echo "Nothing new this week."
            exit 0
          fi
          git config user.name "tons-of-consequence-bot"
          git config user.email "tons-of-consequence-bot@users.noreply.github.com"
          { echo "data: season update"; echo; cat update.log; } > commit-message.txt
          git add src/data docs/drafts
          git commit -F commit-message.txt
          git pull --rebase origin main
          git push
          echo "published=true" >> "$GITHUB_OUTPUT"

      # New tons of consequence from this update go out as push notifications (OneSignal). Needs two repository secrets,
      # ONESIGNAL_APP_ID and ONESIGNAL_API_KEY; without them it just says so. Never fails the run: the data is already live.
      - name: Notify the app about new tons of consequence
        if: steps.publish.outputs.published == 'true'
        continue-on-error: true
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
        run: node scripts/notify-new-tons.mjs --from HEAD~1
